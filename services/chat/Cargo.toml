[package]
name = "chat"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-nats = { workspace = true }
aws-lc-rs = "1.18.1"
axum = { workspace = true }
base64 = { workspace = true }
bytes = "1"
chrono = { workspace = true, features = ["serde"] }
common = { workspace = true }
config = { workspace = true }
control = { workspace = true }
db = { workspace = true }
futures-util = { workspace = true }
http = "1.5.0"
live = { workspace = true }
obs-actions = { workspace = true }
prost = "0.14.4"
reqwest = { workspace = true, features = ["form", "json", "query"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "tls-aws-lc", "tls-webpki-roots"] }
tonic-prost = "0.14.6"
tracing = { workspace = true }
opentelemetry = { workspace = true }
telemetry = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
axum = { workspace = true, features = ["http2", "ws"] }
tonic = { version = "0.14.6", default-features = false, features = ["server"] }
