[package]
name = "chat"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-nats = { workspace = true }
aws-lc-rs.workspace = true
axum = { workspace = true }
base64 = { workspace = true }
bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
common = { workspace = true }
config = { workspace = true }
control = { workspace = true }
db = { workspace = true }
futures-util = { workspace = true }
http.workspace = true
live = { workspace = true }
obs-actions = { workspace = true }
polib.workspace = true
prost.workspace = true
reqwest = { workspace = true, features = ["form", "json", "query"] }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tonic = { workspace = true, features = ["channel", "tls-aws-lc", "tls-webpki-roots"] }
tonic-prost.workspace = true
tracing = { workspace = true }
opentelemetry = { workspace = true }
telemetry = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
axum = { workspace = true, features = ["http2", "ws"] }
tonic = { workspace = true, features = ["server"] }
