[package]
name = "api"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-nats.workspace = true
axum = { workspace = true, features = ["tracing"] }
axum-extra.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
base64.workspace = true
chrono.workspace = true
common.workspace = true
config.workspace = true
db.workspace = true
obs-actions.workspace = true
live = { workspace = true, features = ["openapi"] }
control = { workspace = true }
futures-util.workspace = true
reqwest = { workspace = true, features = ["form", "json", "query"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true }
opentelemetry = { workspace = true }
telemetry = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
http-body-util.workspace = true
