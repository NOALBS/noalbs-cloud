[workspace]
members = ["core", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
directories = "6.0.0"
futures-util = "0.3.33"
keyring = { version = "3.6.3", default-features = false, features = ["linux-native", "windows-native"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
sysinfo = "0.36.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
