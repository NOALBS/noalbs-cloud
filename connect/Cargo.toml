[workspace]
members = ["core", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
publish = false

[workspace.dependencies]
axum = "0.8.9"
common = { path = "../crates/common" }
connect-core = { path = "core" }
nix = "0.32.0"
objc2-app-kit = { version = "0.3.2", default-features = false }
plist = "1.10.4"
semver = "1.0.28"
tauri = "2.12.7"
tauri-build = "2.7.6"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tempfile = "3.27.0"
windows-sys = "0.61.2"
winreg = "0.56.0"
zbus = "6.5.0"
base64 = "0.23.1"
chrono = "0.4.45"
directories = "6.0.0"
flate2 = "1.1.11"
futures-util = "0.3.34"
keyring = { version = "3.6.3", default-features = false, features = ["linux-native", "windows-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["serde", "v4"] }
