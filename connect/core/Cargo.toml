[package]
name = "connect-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
common.workspace = true
directories.workspace = true
flate2.workspace = true
futures-util.workspace = true
keyring.workspace = true
obs-protocol.workspace = true
plist.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
objc2-app-kit = { workspace = true, features = ["NSRunningApplication", "libc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
winreg.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
