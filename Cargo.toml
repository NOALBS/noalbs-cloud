[workspace]
resolver = "3"
members = ["crates/common", "crates/control", "crates/db", "crates/live", "crates/obs-actions", "crates/telemetry", "services/api", "services/chat", "services/db-migrator", "services/obs-link"]

[workspace.package]
license = "AGPL-3.0-or-later"
repository = "https://github.com/NOALBS/noalbs-cloud"
publish = false

[workspace.dependencies]
async-nats = "0.50.0"
async-trait = "0.1.91"
base64 = "0.22.1"
common = { version = "0.1.0", path = "crates/common" }
control = { version = "0.1.0", path = "crates/control" }
config = "0.15.25"
db = { version = "0.1.0", path = "crates/db" }
futures-util = "0.3.33"
http-body-util = "0.1.4"
quick-xml = { version = "0.38", features = ["serialize"] }
nanoid = "0.5.0"
obs-actions = { version = "0.1.0", path = "crates/obs-actions" }
reqwest = "0.13.4"
serde = "1.0.229"
serde_json = "1.0.151"
serde_repr = "0.1.21"
sha2 = "0.10.9"
hmac = "0.12.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "migrate", "uuid"] }
thiserror = "2.0.19"
tokio = "1.53.1"
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
telemetry = { version = "0.1.0", path = "crates/telemetry" }
# Logs, traces and metrics over OTLP (`crates/telemetry`). These move in
# lockstep: tracing-opentelemetry 0.34 goes with opentelemetry 0.33.
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = ["gzip-http", "reqwest-rustls"] }
opentelemetry-appender-tracing = { version = "0.33.1", features = ["experimental_span_attributes"] }
tracing-opentelemetry = "0.34.0"
time = "0.3.44"
uuid = "1.24.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-private", "cookie-key-expansion"] }
chrono = "0.4.45"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3.0"
getrandom = "0.3.4"
aes-gcm = "0.11.1"
live = { version = "0.1.0", path = "crates/live" }
