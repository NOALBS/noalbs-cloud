<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NOALBS</title>
    <script>
      // Apply the theme before first paint to avoid a flash: the saved choice, or on
      // Auto (nothing saved, or "system") the browser's setting (see src/lib/theme.ts).
      try {
        const saved = localStorage.getItem("noalbs-theme");
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : prefersLight ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
