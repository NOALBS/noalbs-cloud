<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0F12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>What's new · NOALBS Cloud</title>
    <meta name="description" content="New features and changes in NOALBS Cloud." />
    <script>
      // Apply the theme before first paint to avoid a flash (same as the dashboard): the
      // saved choice, or on Auto the browser's setting, following it when it changes.
      try {
        const media = window.matchMedia("(prefers-color-scheme: light)");
        const apply = () => {
          const saved = localStorage.getItem("noalbs-theme");
          document.documentElement.dataset.theme =
            saved === "light" || saved === "dark" ? saved : media.matches ? "light" : "dark";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute(
              "content",
              document.documentElement.dataset.theme === "light" ? "#F5F5F7" : "#0E0F12",
            );
        };
        const textSize = localStorage.getItem("noalbs-text-size");
        document.documentElement.dataset.textSize =
          textSize === "large" || textSize === "larger" ? textSize : "default";
        apply();
        media.addEventListener("change", apply);
      } catch {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.dataset.textSize = "default";
      }
    </script>
  </head>
  <body>
    <div class="mx-auto flex max-w-3xl flex-col px-5 sm:px-8">
      <header class="flex h-18 items-center justify-between gap-4">
        <a href="/" class="flex items-center gap-2 font-mono text-lg font-bold tracking-wide">
          <svg viewBox="0 0 260 262" class="size-[1.3em]" aria-hidden="true">
            <g fill="#5576DA" stroke="#0B0D10" stroke-width="6" stroke-linejoin="round">
              <path d="M22 62 L90 169 L90 243 L22 243 Z" />
              <path d="M24 17 L93 17 L238 245 L169 245 Z" />
              <path d="M169 17 L237 17 L237 204 L169 97 Z" />
            </g>
          </svg>
          NOALBS
        </a>
        <a href="/login" class="rounded-lg border border-border-strong px-3.5 py-2 text-sm font-medium hover:bg-surface-2">Sign in</a>
      </header>


      <main class="legal flex flex-col gap-12 pt-10 pb-20">
        <div class="flex flex-col gap-3">
          <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">What's new</h1>
          <p>New features and changes in NOALBS Cloud, newest first.</p>
        </div>

        <!-- whats-new:posts -->

      <footer class="flex flex-col gap-4 border-t border-divider py-8 text-sm text-muted-foreground sm:flex-row sm:items-center sm:justify-between">
        <span class="font-mono font-bold tracking-wide text-foreground">NOALBS</span>
        <nav class="flex flex-wrap gap-x-6 gap-y-2">
          <a href="https://discord.gg/efWu5HWM2u" class="hover:text-foreground">Discord</a>
          <a href="https://x.com/noalbs" class="hover:text-foreground">X</a>

          <a href="/licenses" class="hover:text-foreground">Licenses</a>

    </div>
    <script type="module" src="/src/legal/main.ts"></script>
  </body>
</html>
