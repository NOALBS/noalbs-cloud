name: Connect Release

on:
  push:
    tags: ["connect-v*"]

concurrency:
  group: connect-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check tag and app versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG"]
          if not tag.startswith("connect-v"):
              raise SystemExit(f"Expected a connect-v tag, got {tag!r}")
          tag_version = tag.removeprefix("connect-v")
          tauri_version = json.loads(
              Path("connect/app/src-tauri/tauri.conf.json").read_text()
          )["version"]
          workspace_version = tomllib.loads(
              Path("connect/Cargo.toml").read_text()
          )["workspace"]["package"]["version"]

          versions = {
              "tag": tag_version,
              "Tauri": tauri_version,
              "Cargo workspace": workspace_version,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Release versions do not match: {versions}")
          print(f"Verified Connect release version {tag_version}")
          PY

  build:
    name: Build (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            bundles: deb,appimage,rpm
          - platform: windows
            os: windows-latest
            bundles: nsis
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: connect
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: connect/app/ui/pnpm-lock.yaml
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf libxdo-dev
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
        working-directory: connect/app/ui
      - name: Build installer
        working-directory: connect/app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            ./ui/node_modules/.bin/tauri build --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
          else
            ./ui/node_modules/.bin/tauri build --config src-tauri/tauri.release.conf.json --bundles "${{ matrix.bundles }}"
          fi
      - name: Copy installer to stable name
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets

          copy_one() {
            local destination="$1"
            shift
            if (($# != 1)); then
              printf 'Expected exactly one input for %s, found %s\n' "$destination" "$#" >&2
              printf '%s\n' "$@" >&2
              exit 1
            fi
            cp -- "$1" "release-assets/$destination"
          }

          case "${{ matrix.platform }}" in
            linux)
              copy_one NOALBS-Cloud-Connect-linux-x86_64.AppImage connect/target/release/bundle/appimage/*.AppImage
              copy_one NOALBS-Cloud-Connect-linux-x86_64.AppImage.sig connect/target/release/bundle/appimage/*.AppImage.sig
              copy_one NOALBS-Cloud-Connect-linux-amd64.deb connect/target/release/bundle/deb/*.deb
              copy_one NOALBS-Cloud-Connect-linux-amd64.deb.sig connect/target/release/bundle/deb/*.deb.sig
              copy_one NOALBS-Cloud-Connect-linux-x86_64.rpm connect/target/release/bundle/rpm/*.rpm
              copy_one NOALBS-Cloud-Connect-linux-x86_64.rpm.sig connect/target/release/bundle/rpm/*.rpm.sig
              ;;
            windows)
              copy_one NOALBS-Cloud-Connect-windows-x64-setup.exe connect/target/release/bundle/nsis/*.exe
              copy_one NOALBS-Cloud-Connect-windows-x64-setup.exe.sig connect/target/release/bundle/nsis/*.exe.sig
              ;;
            macos)
              copy_one NOALBS-Cloud-Connect-macos-universal.dmg connect/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              copy_one NOALBS-Cloud-Connect-macos-universal.app.tar.gz connect/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              copy_one NOALBS-Cloud-Connect-macos-universal.app.tar.gz.sig connect/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: connect-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          pattern: connect-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#connect-v}"
          python3 .github/scripts/connect-update-manifest.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --assets-dir release-assets
          (cd release-assets && sha256sum -- * > SHA256SUMS)
      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash .github/scripts/connect-release-notes.sh "$TAG" > notes.md
          printf '\n## Unsigned builds\n\n- **Windows SmartScreen:** select **More info** → **Run anyway**.\n- **macOS:** right-click → **Open**, or use **System Settings → Privacy & Security → Open Anyway**.\n- Verify downloads with SHA256SUMS.\n' >> notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#connect-v}"
          gh release create "$TAG" \
            release-assets/NOALBS-Cloud-Connect-windows-x64-setup.exe \
            release-assets/NOALBS-Cloud-Connect-windows-x64-setup.exe.sig \
            release-assets/NOALBS-Cloud-Connect-macos-universal.dmg \
            release-assets/NOALBS-Cloud-Connect-macos-universal.app.tar.gz \
            release-assets/NOALBS-Cloud-Connect-macos-universal.app.tar.gz.sig \
            release-assets/NOALBS-Cloud-Connect-linux-x86_64.AppImage \
            release-assets/NOALBS-Cloud-Connect-linux-x86_64.AppImage.sig \
            release-assets/NOALBS-Cloud-Connect-linux-amd64.deb \
            release-assets/NOALBS-Cloud-Connect-linux-amd64.deb.sig \
            release-assets/NOALBS-Cloud-Connect-linux-x86_64.rpm \
            release-assets/NOALBS-Cloud-Connect-linux-x86_64.rpm.sig \
            release-assets/latest.json \
            release-assets/SHA256SUMS \
            --title "NOALBS Cloud Connect $VERSION" \
            --notes-file notes.md \
            --latest
