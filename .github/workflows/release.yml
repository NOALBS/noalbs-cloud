name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/changed-images.mjs"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "services/**"
      - "web/dashboard/**"

  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Rebuild and deploy every image, changed or not"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: noalbs-cloud

jobs:
  # Which images changed since the build production runs (see the script), so
  # e.g. a dashboard change doesn't restart obs-link and drop every browser
  # source. The dashboard image is the static app + browser source behind
  # Caddy; see deploy/README.md.
  changes:
    # Only main is released: a manual run from another branch would push its
    # images as :latest. Skipping this job skips the ones that need it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      services: ${{ steps.changes.outputs.services }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: NOALBS/noalbs-cloud-argocd-manifests
          ssh-key: ${{ secrets.MANIFESTS_DEPLOY_KEY }}
          path: manifests

      - name: Find changed images
        id: changes
        env:
          MANIFESTS_DIR: manifests
          REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: node .github/scripts/changed-images.mjs

  docker:
    needs: changes
    if: needs.changes.outputs.services != ''
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_PREFIX}/${{ matrix.service }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          {
            echo "image=$IMAGE"
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-$SHORT_SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          # Telemetry reports it as the service version (the dashboard ignores it).
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Points production at this build: commits the new sha tags of the images
  # built here to every overlay in the manifests repo, which ArgoCD then syncs;
  # the others keep the build they're unchanged since. Skipped when any image
  # failed (the next run builds it again, since it compares against what's
  # deployed), so a cluster never gets half of a change.
  deploy:
    needs: [changes, docker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-manifests
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          repository: NOALBS/noalbs-cloud-argocd-manifests
          ssh-key: ${{ secrets.MANIFESTS_DEPLOY_KEY }}

      - name: Set the image tags
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_PREFIX}"
          TAG="sha-${GITHUB_SHA::7}"

          for overlay in apps/noalbs/overlays/*/; do
            for service in $SERVICES; do
              (cd "$overlay" && kustomize edit set image "$PREFIX/$service:$TAG")
            done
          done

      - name: Commit and push
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          SOURCE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/noalbs/overlays
          if git diff --cached --quiet; then
            echo "Already at this build."
            exit 0
          fi
          git commit -m "noalbs: deploy ${GITHUB_SHA::7} (${SERVICES// /, })" -m "$SOURCE_MESSAGE"
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
